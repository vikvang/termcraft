# ❤️ Built with warp.dev
[package]
name = "termcraft-3d"
version = "0.2.0"
edition = "2021"
description = "A Minecraft-inspired first-person 3D sandbox game for your terminal, with seed-based multiplayer"
license = "MIT"
repository = "https://github.com/vikvang/termcraft"
readme = "README.md"
keywords = ["game", "terminal", "tui", "voxel", "multiplayer"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "termcraft"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
